<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Réserver en magasin</title><link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Réserver en magasin</h1>
<p class="sub">Premier arrivé, premier servi : réservez, puis venez retirer vos produits.</p>
<label for="magasin">Magasin</label>
<select id="magasin"><option value="">Choisir un magasin…</option></select>

<section id="catalogue" class="hidden"><h2>Produits</h2><div id="produits"></div>
<div class="total" id="total">Total : 0,00 €</div>

<h2>Vos informations</h2>
<form id="form" novalidate>
 <div class="grid2">
  <div><label for="prenom">Prénom</label><input id="prenom" required autocomplete="given-name"></div>
  <div><label for="nom">Nom</label><input id="nom" required autocomplete="family-name"></div>
  <div><label for="tel">Téléphone</label><input id="tel" type="tel" required autocomplete="tel"></div>
  <div><label for="email">E-mail</label><input id="email" type="email" required autocomplete="email"></div>
 </div>
 <div class="err" id="erreur" role="alert"></div>
 <button type="submit" id="valider">Réserver</button>
</form></section>

<section id="confirmation" class="hidden card"><h2 class="okmsg">Réservation confirmée</h2>
<p>Numéro : <strong id="numero"></strong>. Présentez-le en magasin.</p>
<button id="pdf">Télécharger le reçu PDF</button> <button class="alt" id="nouvelle">Nouvelle réservation</button></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
